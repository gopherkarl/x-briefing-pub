<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Reachy Mini Pet Sentry system architecture</title>
  <desc id="desc">A left-to-right diagram showing the Reachy Mini camera and microphones, a MacBook dog detector server, the Reachy Mini application and report, plus a written safety and classification policy layer.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0071e3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#af52de" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>.title{font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d1d1f}.label{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d1d1f}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6e6e73}.legend{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1d1d1f}</style>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#f5f5f7"/>
  <text x="48" y="48" class="title">Pet Sentry: sensing, interpretation, and reporting</text>
  <text x="48" y="75" class="small">The MacBook supplies visual recognition; Reachy Mini coordinates the physical session.</text>
  <rect x="40" y="112" width="284" height="310" rx="18" fill="#e6f1fb" stroke="#185fa5"/><text x="64" y="148" class="label">Reachy Mini</text><text x="64" y="174" class="small">Physical sensing and control</text>
  <rect x="64" y="202" width="236" height="58" rx="10" fill="#fff" stroke="#b5d4f4"/><text x="182" y="225" text-anchor="middle" class="label" font-size="15">Camera</text><text x="182" y="246" text-anchor="middle" class="small">Frames of the dog area</text>
  <rect x="64" y="278" width="236" height="58" rx="10" fill="#fff" stroke="#b5d4f4"/><text x="182" y="301" text-anchor="middle" class="label" font-size="15">Microphone array</text><text x="182" y="322" text-anchor="middle" class="small">Audio for bark detection</text>
  <rect x="64" y="354" width="236" height="44" rx="10" fill="#fff" stroke="#b5d4f4"/><text x="182" y="381" text-anchor="middle" class="small">Optional bounded head scan</text>
  <rect x="388" y="112" width="330" height="310" rx="18" fill="#fbeaf0" stroke="#993556"/><text x="414" y="148" class="label">MacBook server</text><text x="414" y="174" class="small">Local visual specialist</text>
  <rect x="414" y="202" width="278" height="64" rx="10" fill="#fff" stroke="#f4c0d1"/><text x="553" y="226" text-anchor="middle" class="label" font-size="15">FastAPI dog detector</text><text x="553" y="248" text-anchor="middle" class="small">Receives JPEG frames on port 8600</text>
  <rect x="414" y="282" width="278" height="64" rx="10" fill="#fff" stroke="#f4c0d1"/><text x="553" y="306" text-anchor="middle" class="label" font-size="15">SSD-MobileNetV1</text><text x="553" y="328" text-anchor="middle" class="small">Dog presence, confidence, and box</text>
  <rect x="414" y="362" width="278" height="36" rx="10" fill="#fff" stroke="#f4c0d1"/><text x="553" y="385" text-anchor="middle" class="small">Auto-started with Reachy Mini Control</text>
  <rect x="782" y="112" width="378" height="310" rx="18" fill="#e1f5ee" stroke="#0f6e56"/><text x="808" y="148" class="label">Robot-side Pet Sentry app</text><text x="808" y="174" class="small">Session coordination and explanation</text>
  <rect x="808" y="202" width="326" height="55" rx="10" fill="#fff" stroke="#9fe1cb"/><text x="971" y="225" text-anchor="middle" class="label" font-size="15">DogClient + state engine</text><text x="971" y="245" text-anchor="middle" class="small">Fuses presence, box movement, and audio</text>
  <rect x="808" y="273" width="326" height="55" rx="10" fill="#fff" stroke="#9fe1cb"/><text x="971" y="296" text-anchor="middle" class="label" font-size="15">Classification priority</text><text x="971" y="316" text-anchor="middle" class="small">Barking → Walking → Lying/Sitting</text>
  <rect x="808" y="344" width="326" height="54" rx="10" fill="#fff" stroke="#9fe1cb"/><text x="971" y="367" text-anchor="middle" class="label" font-size="15">Markdown report</text><text x="971" y="387" text-anchor="middle" class="small">Time, percentages, bouts, and uncertainty</text>
  <line x1="300" y1="231" x2="405" y2="231" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="352" y="214" text-anchor="middle" class="small">JPEG frames</text>
  <line x1="705" y1="285" x2="799" y2="285" stroke="#af52de" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="752" y="268" text-anchor="middle" class="small">presence + box</text>
  <path d="M300 307 V450 H760 V300 H799" fill="none" stroke="#0071e3" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><text x="520" y="440" text-anchor="middle" class="small">16 kHz audio stays local</text>
  <rect x="40" y="482" width="1120" height="108" rx="18" fill="#fff" stroke="#af52de" stroke-width="1" stroke-dasharray="6 5"/><text x="64" y="516" class="label">Written safety and policy layer</text><text x="64" y="542" class="small">Controls what the system is allowed to do: base remains stationary; head scans are optional, slow, bounded, and cooled down;</text><text x="64" y="565" class="small">uncertainty defaults to Lying/Sitting; diagnostic evidence is retained so reports can be criticized rather than blindly trusted.</text>
  <circle cx="64" cy="615" r="6" fill="#0071e3"/><text x="78" y="620" class="legend">sensor / transport</text><circle cx="222" cy="615" r="6" fill="#af52de"/><text x="236" y="620" class="legend">visual inference</text><circle cx="376" cy="615" r="6" fill="#0f6e56"/><text x="390" y="620" class="legend">application output</text><circle cx="560" cy="615" r="6" fill="#6e6e73"/><text x="574" y="620" class="legend">policy / safety</text>
</svg>
