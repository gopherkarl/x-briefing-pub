<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Daily photo pipeline architecture</title>
  <desc id="desc">A logical left-to-right architecture diagram. The written composition skill governs the neural interpretation and composition judge. Symbolic geometry verifies crop candidates before publication.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,-apple-system,sans-serif;fill:#f8fafc}
      .subtitle{font:400 18px system-ui,-apple-system,sans-serif;fill:#94a3b8}
      .section{font:700 14px ui-monospace,SFMono-Regular,monospace;letter-spacing:1.5px}
      .name{font:600 20px system-ui,-apple-system,sans-serif;fill:#f8fafc}
      .small{font:400 15px system-ui,-apple-system,sans-serif;fill:#cbd5e1}
      .tiny{font:400 12px ui-monospace,SFMono-Regular,monospace;fill:#94a3b8}
      .flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .flowlabel{font:400 12px ui-monospace,SFMono-Regular,monospace;fill:#94a3b8;text-anchor:middle}
      .panel{fill:#0f172a;stroke-width:1.5}
      .govern{fill:#1c1917;stroke:#fbbf24;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#020617"/>
  <rect width="1600" height="980" fill="url(#grid)" opacity=".55"/>

  <text x="64" y="68" class="section" fill="#22d3ee">DAILY PHOTO / SYSTEM ARCHITECTURE</text>
  <text x="64" y="112" class="title">From photograph to publishable crop</text>
  <text x="64" y="142" class="subtitle">A linear data path, with the written composition skill shown as a governing policy layer.</text>

  <!-- governance is a boundary, not a tangled data-flow arrow -->
  <rect x="64" y="180" width="1472" height="148" rx="12" class="govern"/>
  <text x="92" y="214" class="section" fill="#fbbf24">GOVERNING POLICY</text>
  <text x="92" y="252" class="name">Written visual-composition skill</text>
  <text x="92" y="280" class="small">Defines the vocabulary and priority order used by interpretation and judgment.</text>
  <text x="92" y="304" class="tiny">anchor  &gt;  essential context  &gt;  focal anomaly  &gt;  background mass</text>
  <g transform="translate(910 212)">
    <rect width="260" height="76" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="18" y="25" class="section" fill="#fbbf24">USED BY</text>
    <text x="18" y="49" class="small">1. neural role assignment</text>
    <text x="18" y="67" class="small">2. judge priority selection</text>
  </g>
  <g transform="translate(1192 212)">
    <rect width="300" height="76" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="18" y="25" class="section" fill="#fbbf24">NOT USED FOR</text>
    <text x="18" y="49" class="small">Exact pixel geometry</text>
    <text x="18" y="67" class="small">Bounding-box containment</text>
  </g>

  <!-- one unambiguous left-to-right path -->
  <text x="64" y="378" class="section" fill="#64748b">DATA PATH / LEFT TO RIGHT</text>

  <path d="M244 504 H282" class="flow"/>
  <path d="M482 504 H520" class="flow"/>
  <path d="M720 504 H758" class="flow"/>
  <path d="M958 504 H996" class="flow"/>
  <path d="M1196 504 H1234" class="flow"/>
  <text x="263" y="484" class="flowlabel">image</text>
  <text x="501" y="484" class="flowlabel">pixels + image</text>
  <text x="739" y="484" class="flowlabel">roles + boxes</text>
  <text x="977" y="484" class="flowlabel">candidates</text>
  <text x="1215" y="484" class="flowlabel">validated crop</text>

  <!-- stage cards -->
  <g>
    <rect x="64" y="430" width="180" height="148" rx="8" class="panel" stroke="#94a3b8"/>
    <text x="86" y="459" class="section" fill="#94a3b8">01 / SOURCE</text>
    <text x="86" y="497" class="name">Photo pool</text>
    <text x="86" y="526" class="small">Select next image</text>
    <text x="86" y="552" class="tiny">rotate.py · state.json</text>

    <rect x="282" y="430" width="200" height="148" rx="8" class="panel" stroke="#a78bfa"/>
    <text x="304" y="459" class="section" fill="#a78bfa">02 / PERCEPTION</text>
    <text x="304" y="497" class="name">Neural analysis</text>
    <text x="304" y="526" class="small">Identify elements</text>
    <text x="304" y="552" class="tiny">anchor · context · anomaly</text>

    <rect x="520" y="430" width="200" height="148" rx="8" class="panel" stroke="#22d3ee"/>
    <text x="542" y="459" class="section" fill="#22d3ee">03 / VERIFICATION</text>
    <text x="542" y="497" class="name">Grounding</text>
    <text x="542" y="526" class="small">Measure actual boxes</text>
    <text x="542" y="552" class="tiny">Grounding DINO-T</text>

    <rect x="758" y="430" width="200" height="148" rx="8" class="panel" stroke="#22d3ee"/>
    <text x="780" y="459" class="section" fill="#22d3ee">04 / GEOMETRY</text>
    <text x="780" y="497" class="name">Crop candidates</text>
    <text x="780" y="526" class="small">Compute visible windows</text>
    <text x="780" y="552" class="tiny">object-fit · overlap · score</text>

    <rect x="996" y="430" width="200" height="148" rx="8" class="panel" stroke="#34d399"/>
    <text x="1018" y="459" class="section" fill="#34d399">05 / JUDGMENT</text>
    <text x="1018" y="497" class="name">Composition judge</text>
    <text x="1018" y="526" class="small">Choose tested candidate</text>
    <text x="1018" y="552" class="tiny">skill hierarchy · no invention</text>

    <rect x="1234" y="430" width="200" height="148" rx="8" class="panel" stroke="#34d399"/>
    <text x="1256" y="459" class="section" fill="#34d399">06 / RELEASE</text>
    <text x="1256" y="497" class="name">QA + publication</text>
    <text x="1256" y="526" class="small">Publish with evidence</text>
    <text x="1256" y="552" class="tiny">report · preview · website</text>
  </g>

  <!-- explicit policy application, using vertical bands rather than diagonal arrows -->
  <rect x="282" y="610" width="200" height="82" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
  <text x="304" y="639" class="section" fill="#fbbf24">POLICY INPUT</text>
  <text x="304" y="665" class="small">Assign roles using the skill</text>
  <path d="M382 610 V578" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="996" y="610" width="200" height="82" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="1018" y="639" class="section" fill="#fbbf24">POLICY INPUT</text>
  <text x="1018" y="665" class="small">Rank tested candidates</text>
  <path d="M1096 610 V578" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- output contract -->
  <rect x="64" y="756" width="1370" height="112" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="92" y="789" class="section" fill="#94a3b8">OUTPUT CONTRACT</text>
  <text x="92" y="823" class="small">The system publishes only after the primary anchor survives the geometry checks and the judge selects from precomputed candidates.</text>
  <text x="92" y="850" class="tiny">Neural: what matters  ·  Symbolic: what fits  ·  Skill: what should win  ·  QA: whether it may ship</text>

  <!-- legend -->
  <text x="64" y="930" class="section" fill="#64748b">LEGEND</text>
  <circle cx="160" cy="926" r="6" fill="#a78bfa"/><text x="178" y="931" class="small">neural interpretation</text>
  <circle cx="364" cy="926" r="6" fill="#22d3ee"/><text x="382" y="931" class="small">independent measurement</text>
  <circle cx="610" cy="926" r="6" fill="#34d399"/><text x="628" y="931" class="small">decision / release</text>
  <circle cx="800" cy="926" r="6" fill="#fbbf24"/><text x="818" y="931" class="small">written skill / policy</text>
  <line x1="1040" y1="926" x2="1080" y2="926" class="flow"/><text x="1094" y="931" class="small">data flow</text>
</svg>
